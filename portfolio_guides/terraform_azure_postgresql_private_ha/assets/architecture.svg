<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Terraform PostgreSQL Flexible Server private HA architecture</title>
  <desc id="desc">Diagram showing an application VNet connecting privately to a delegated subnet hosting PostgreSQL Flexible Server with private DNS, zone-redundant HA, and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FBFF"/>
      <stop offset="100%" stop-color="#E8F3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A4678" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2C77DA"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A2A6D">Terraform PostgreSQL Flexible Server Platform</text>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D6F96">Private networking, delegated subnet design, and zone-aware availability.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" rx="28" ry="28" width="1460" height="170" fill="#EAF4FF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="70" y="390" rx="28" ry="28" width="1460" height="230" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="70" y="650" rx="28" ry="28" width="1460" height="190" fill="#F4FAFF" stroke="#C8DCF7" stroke-width="2"/>
  </g>

  <text x="102" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Application Path</text>
  <text x="102" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Data Platform</text>
  <text x="102" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Operational Baseline</text>

  <g filter="url(#shadow)">
    <rect x="130" y="250" rx="22" ry="22" width="240" height="70" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="450" y="235" rx="24" ry="24" width="340" height="100" fill="#0D3C9A"/>
    <rect x="870" y="250" rx="22" ry="22" width="280" height="70" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="1220" y="235" rx="24" ry="24" width="230" height="100" fill="#EAF8EE" stroke="#B9E1C6" stroke-width="2"/>

    <rect x="190" y="460" rx="24" ry="24" width="320" height="108" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="590" y="444" rx="24" ry="24" width="420" height="140" fill="#173360"/>
    <rect x="1090" y="460" rx="24" ry="24" width="260" height="108" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>

    <rect x="170" y="725" rx="22" ry="22" width="240" height="72" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="470" y="725" rx="22" ry="22" width="240" height="72" fill="#EEF5FF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="770" y="725" rx="22" ry="22" width="260" height="72" fill="#EEF5FF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="1090" y="725" rx="22" ry="22" width="280" height="72" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
  </g>

  <text x="190" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">App Tier</text>
  <text x="514" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Application VNet</text>
  <text x="502" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#CFE3FF">Private app and data connectivity</text>
  <text x="906" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private DNS Zone</text>
  <text x="1268" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#106B42">Key Vault</text>
  <text x="1246" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F6D4B">Passwords and connection secrets</text>

  <text x="232" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Delegated Subnet</text>
  <text x="228" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#4D6F96">Microsoft.DBforPostgreSQL/flexibleServers</text>
  <text x="654" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">PostgreSQL Flexible Server</text>
  <text x="650" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#D4E5FF">Private access, zone-redundant HA, backups</text>
  <text x="1136" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Client Connectivity</text>
  <text x="1142" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#4D6F96">App services, AKS, VM workloads</text>

  <text x="215" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Log Analytics</text>
  <text x="522" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Metrics</text>
  <text x="826" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Diagnostics</text>
  <text x="1170" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Alerts And Runbooks</text>

  <path d="M370 285 H442" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M790 285 H862" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1150 285 H1212" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M620 335 V432 H350 V452" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 335 V432 H800 V436" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1160 514 H1018" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 584 V710 H290 V717" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M800 584 V710 H590 V717" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M800 584 V710 H900 V717" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M800 584 V710 H1230 V717" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
</svg>
