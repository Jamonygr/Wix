<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Azure zero-trust App Service request flow</title>
  <desc id="desc">A swimlane diagram showing the user request path through Azure Front Door to App Service and the app's secret retrieval and telemetry flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="100%" stop-color="#EAF3FF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7AD8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#174A7A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="70" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A2A6D">Request Flow And Secret Resolution</text>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#4A6D95">This view is useful in a portfolio because it shows what happens at runtime, not just which Azure icons were deployed.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" rx="24" ry="24" width="1460" height="120" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="70" y="324" rx="24" ry="24" width="1460" height="120" fill="#EFF6FF" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="70" y="468" rx="24" ry="24" width="1460" height="120" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="70" y="612" rx="24" ry="24" width="1460" height="120" fill="#EFF8F0" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="70" y="756" rx="24" ry="24" width="1460" height="100" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
  </g>

  <text x="102" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">1. Browser</text>
  <text x="102" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">2. Azure Front Door Premium</text>
  <text x="102" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">3. Azure App Service</text>
  <text x="102" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F6A40">4. Private Services</text>
  <text x="102" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">5. Azure Monitor</text>

  <g>
    <circle cx="404" cy="240" r="26" fill="#0D3C9A"/>
    <text x="396" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">1</text>
    <text x="452" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#35577F">The user hits the custom domain on Front Door.</text>

    <circle cx="404" cy="384" r="26" fill="#0D3C9A"/>
    <text x="396" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">2</text>
    <text x="452" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#35577F">Front Door applies WAF rules, bot protection, and routing logic.</text>

    <circle cx="404" cy="528" r="26" fill="#0D3C9A"/>
    <text x="396" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">3</text>
    <text x="452" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#35577F">Traffic reaches the App Service origin through Private Link.</text>

    <circle cx="404" cy="672" r="26" fill="#1A8B56"/>
    <text x="396" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">4</text>
    <text x="452" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#2F6A49">The app uses managed identity and VNet integration to reach Key Vault and private dependencies.</text>

    <circle cx="404" cy="810" r="26" fill="#0D3C9A"/>
    <text x="396" y="819" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">5</text>
    <text x="452" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#35577F">Metrics, traces, WAF logs, and alerts are emitted for operators.</text>
  </g>

  <g stroke="#2E7AD8" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round">
    <path d="M1120 240 H1370 V384 H1120"/>
    <path d="M1120 384 H1370 V528 H1120"/>
    <path d="M1120 528 H1370 V672 H1120"/>
    <path d="M1120 672 H1370 V810 H1120"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="206" rx="20" ry="20" width="270" height="70" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="1140" y="350" rx="20" ry="20" width="270" height="70" fill="#0D3C9A"/>
    <rect x="1140" y="494" rx="20" ry="20" width="270" height="70" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
    <rect x="1140" y="638" rx="20" ry="20" width="270" height="70" fill="#EAF8EE" stroke="#B4E2C2" stroke-width="2"/>
    <rect x="1140" y="782" rx="20" ry="20" width="270" height="56" fill="#EEF5FF" stroke="#C6DBF8" stroke-width="2"/>
  </g>

  <text x="1216" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Customer Request</text>
  <text x="1174" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">WAF + Route Decision</text>
  <text x="1196" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">App Execution</text>
  <text x="1172" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0F6A40">Secret + Dependency Call</text>
  <text x="1216" y="819" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#0A2A6D">Operator Signal</text>

  <rect x="70" y="140" rx="18" ry="18" width="430" height="34" fill="#FFFFFF" stroke="#C6DBF8" stroke-width="2"/>
  <text x="92" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#45688F">Key runtime point: private endpoint covers inbound traffic, VNet integration covers outbound traffic.</text>
</svg>
