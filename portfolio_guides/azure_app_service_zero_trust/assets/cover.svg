    <text x="1064" y="607" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#4070A0">Private origin + managed identity</text>

    <rect x="1300" y="520" rx="22" ry="22" width="138" height="98" fill="#E6F9EE" stroke="#A9E6B9" stroke-width="2"/>
    <text x="1328" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F6A40">Key</text>
    <text x="1314" y="607" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F6A40">Vault</text>

