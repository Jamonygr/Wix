    <path d="M1215 470 V515" stroke="#0D3C9A" stroke-width="7" stroke-linecap="round"/>
    <path d="M1272 568 H1290" stroke="#2E7AD8" stroke-width="5" stroke-linecap="round"/>
    <path d="M1219 618 V647" stroke="#2E7AD8" stroke-width="5" stroke-linecap="round"/>

    <circle cx="1215" cy="332" r="10" fill="#8EF0FF"/>
    <circle cx="1215" cy="470" r="10" fill="#8EF0FF"/>
    <circle cx="1274" cy="568" r="8" fill="#8EF0FF"/>
    <circle cx="1219" cy="647" r="8" fill="#8EF0FF"/>
