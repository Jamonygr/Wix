<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Trust Azure App Service Guide Cover</title>
  <desc id="desc">A stylized cover image for a portfolio guide about securing Azure App Service with Front Door, Private Link, Key Vault, and managed identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A3D"/>
      <stop offset="55%" stop-color="#0C4FD8"/>
      <stop offset="100%" stop-color="#47C3F3"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FBFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#DCEEFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8EF0FF"/>
      <stop offset="100%" stop-color="#B9FFB7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05204D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.12">
