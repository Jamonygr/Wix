  <rect x="96" y="770" rx="20" ry="20" width="500" height="16" fill="#FFFFFF" opacity="0.18"/>
  <rect x="96" y="770" rx="20" ry="20" width="440" height="16" fill="url(#accent)"/>
  <text x="96" y="835" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#DDF3FF">Portfolio theme: secure edge, private application path, and evidence-based operations</text>
