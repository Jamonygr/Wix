    <path d="M540 0 V900"/>
    <path d="M720 0 V900"/>
    <path d="M900 0 V900"/>
    <path d="M1080 0 V900"/>
    <path d="M1260 0 V900"/>
    <path d="M1440 0 V900"/>
  </g>

  <rect x="96" y="82" rx="18" ry="18" width="260" height="46" fill="#0A2A6D" stroke="#92DFFF" stroke-width="1.5"/>
