  <text x="96" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">Build A Zero-Trust</text>
  <text x="96" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">Azure App Service Platform</text>
  <text x="96" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#D7EEFF">Front Door Premium, Private Link, Key Vault, managed identity, and production observability in one reference architecture.</text>

  <rect x="96" y="430" rx="22" ry="22" width="208" height="62" fill="#FFFFFF" opacity="0.12" stroke="#BFE8FF" stroke-width="1.5"/>
  <rect x="324" y="430" rx="22" ry="22" width="220" height="62" fill="#FFFFFF" opacity="0.12" stroke="#BFE8FF" stroke-width="1.5"/>
  <rect x="564" y="430" rx="22" ry="22" width="250" height="62" fill="#FFFFFF" opacity="0.12" stroke="#BFE8FF" stroke-width="1.5"/>
  <text x="126" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Secure Edge</text>
