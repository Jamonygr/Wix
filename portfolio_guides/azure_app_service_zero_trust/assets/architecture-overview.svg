<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Azure zero-trust App Service architecture overview</title>
  <desc id="desc">A diagram showing Azure Front Door Premium at the public edge, a private App Service origin, VNet integration for outbound access, private DNS, Key Vault, and Azure Monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FBFF"/>
      <stop offset="100%" stop-color="#E6F2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#174A7A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B77DA"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5B8F"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="70" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A2A6D">Zero-Trust Azure App Service Reference Architecture</text>
  <text x="70" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#486A92">Public traffic terminates at Front Door. The origin stays private. Secrets and dependencies are reached through controlled outbound networking.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="180" rx="28" ry="28" width="1480" height="188" fill="#EAF4FF" stroke="#C3DAF8" stroke-width="2"/>
    <rect x="60" y="396" rx="28" ry="28" width="1480" height="268" fill="#FFFFFF" stroke="#C3DAF8" stroke-width="2"/>
    <rect x="60" y="694" rx="28" ry="28" width="1480" height="226" fill="#F5FAFF" stroke="#C3DAF8" stroke-width="2"/>
  </g>

  <text x="94" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Public Edge</text>
  <text x="94" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Application Platform</text>
  <text x="94" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private Dependencies And Operations</text>

  <g filter="url(#shadow)">
    <rect x="116" y="252" rx="24" ry="24" width="190" height="78" fill="#FFFFFF" stroke="#BBD4F6" stroke-width="2"/>
    <rect x="390" y="236" rx="26" ry="26" width="360" height="112" fill="#0D3C9A"/>
    <rect x="796" y="252" rx="24" ry="24" width="224" height="78" fill="#FFFFFF" stroke="#BBD4F6" stroke-width="2"/>
    <rect x="1068" y="236" rx="26" ry="26" width="390" height="112" fill="#142C58"/>

    <rect x="178" y="476" rx="26" ry="26" width="420" height="132" fill="#FFFFFF" stroke="#C2D8F7" stroke-width="2"/>
    <rect x="650" y="492" rx="24" ry="24" width="220" height="98" fill="#35B3FF"/>
    <rect x="924" y="476" rx="26" ry="26" width="440" height="132" fill="#FDFEFF" stroke="#C2D8F7" stroke-width="2"/>

    <rect x="130" y="780" rx="24" ry="24" width="240" height="92" fill="#FFFFFF" stroke="#C2D8F7" stroke-width="2"/>
    <rect x="410" y="780" rx="24" ry="24" width="270" height="92" fill="#EAF8EE" stroke="#B4E2C2" stroke-width="2"/>
    <rect x="720" y="780" rx="24" ry="24" width="270" height="92" fill="#EAF4FF" stroke="#C2D8F7" stroke-width="2"/>
    <rect x="1030" y="780" rx="24" ry="24" width="240" height="92" fill="#FFFFFF" stroke="#C2D8F7" stroke-width="2"/>
    <rect x="1310" y="780" rx="24" ry="24" width="170" height="92" fill="#EEF5FF" stroke="#C2D8F7" stroke-width="2"/>
  </g>

  <text x="156" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A2A6D">Users</text>
  <text x="442" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Azure Front Door Premium</text>
  <text x="496" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#CFE3FF">TLS, routing, health probes, global entry point</text>
  <text x="840" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Custom Domain</text>
  <text x="1118" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">WAF Policy</text>
  <text x="1118" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#D5E5FF">Managed rules, bot protection, rate limits</text>

  <text x="214" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#0A2A6D">Azure App Service</text>
  <text x="214" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#476A90">System-assigned managed identity</text>
  <text x="214" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#476A90">Public access disabled after validation</text>
  <text x="694" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#08345E">Private Link</text>
  <text x="694" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#08345E">Front Door to App Service origin</text>
  <text x="968" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#0A2A6D">VNet Integration</text>
  <text x="968" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#476A90">Delegated subnet for outbound private access</text>
  <text x="968" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#476A90">Separate from private endpoint subnet</text>

  <text x="180" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Private DNS</text>
  <text x="170" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#4B6E95">privatelink.azurewebsites.net</text>
  <text x="452" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F6A40">Azure Key Vault</text>
  <text x="446" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#31835A">Secrets resolved through references</text>
  <text x="766" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Private Endpoints</text>
  <text x="754" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#4B6E95">Storage, SQL, APIs, internal services</text>
  <text x="1066" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Application Insights</text>
  <text x="1060" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#4B6E95">Requests, traces, dependency calls</text>
  <text x="1350" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Alerts</text>
  <text x="1334" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#4B6E95">Ops response</text>

  <path d="M306 291 H382" stroke="#2B77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M750 291 H790" stroke="#2B77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1020 291 H1062" stroke="#2B77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M570 348 V418 H760 V484" stroke="#2B77DA" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M760 590 V640 H1146 V470" stroke="#2F5B8F" stroke-width="5" fill="none" stroke-dasharray="12 10" marker-end="url(#arrowSoft)"/>
  <path d="M390 608 V686 H545 V774" stroke="#2F5B8F" stroke-width="5" fill="none" stroke-dasharray="12 10" marker-end="url(#arrowSoft)"/>
  <path d="M1138 608 V690 H855 V774" stroke="#2F5B8F" stroke-width="5" fill="none" stroke-dasharray="12 10" marker-end="url(#arrowSoft)"/>
  <path d="M1140 608 V690 H1140 V774" stroke="#2F5B8F" stroke-width="5" fill="none" stroke-dasharray="12 10" marker-end="url(#arrowSoft)"/>
  <path d="M1140 608 V690 H1395 V774" stroke="#2F5B8F" stroke-width="5" fill="none" stroke-dasharray="12 10" marker-end="url(#arrowSoft)"/>

  <rect x="1230" y="124" rx="18" ry="18" width="310" height="42" fill="#FFFFFF" stroke="#C3DAF8" stroke-width="2"/>
  <circle cx="1260" cy="145" r="8" fill="#2B77DA"/>
  <text x="1278" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#35577F">Solid arrows = request path</text>
  <circle cx="1445" cy="145" r="8" fill="#2F5B8F"/>
  <text x="1463" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#35577F">Dashed arrows = operational path</text>
</svg>
