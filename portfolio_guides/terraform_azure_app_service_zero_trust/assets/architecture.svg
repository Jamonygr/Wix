<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Terraform zero-trust App Service architecture</title>
  <desc id="desc">Diagram showing Azure Front Door Premium, App Service private endpoint, VNet integration, Key Vault, private DNS, and Azure Monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FBFF"/>
      <stop offset="100%" stop-color="#E8F3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A4678" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2C77DA"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A2A6D">Terraform Zero-Trust App Service Platform</text>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D6F96">One public edge, one private origin, one clean secret path.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" rx="28" ry="28" width="1460" height="150" fill="#EAF4FF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="70" y="360" rx="28" ry="28" width="1460" height="220" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="70" y="610" rx="28" ry="28" width="1460" height="230" fill="#F4FAFF" stroke="#C8DCF7" stroke-width="2"/>
  </g>

  <text x="102" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Public Edge</text>
  <text x="102" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Application Path</text>
  <text x="102" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private Dependencies And Operations</text>

  <g filter="url(#shadow)">
    <rect x="120" y="238" rx="22" ry="22" width="190" height="62" fill="#FFFFFF" stroke="#BFD6F7" stroke-width="2"/>
    <rect x="390" y="222" rx="24" ry="24" width="400" height="94" fill="#0D3C9A"/>
    <rect x="890" y="238" rx="22" ry="22" width="240" height="62" fill="#FFFFFF" stroke="#BFD6F7" stroke-width="2"/>
    <rect x="1160" y="222" rx="24" ry="24" width="300" height="94" fill="#173360"/>

    <rect x="190" y="442" rx="24" ry="24" width="360" height="112" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="620" y="455" rx="22" ry="22" width="210" height="86" fill="#3AB7FF"/>
    <rect x="900" y="442" rx="24" ry="24" width="420" height="112" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>

    <rect x="130" y="715" rx="22" ry="22" width="220" height="82" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="400" y="715" rx="22" ry="22" width="240" height="82" fill="#EAF8EE" stroke="#B9E1C6" stroke-width="2"/>
    <rect x="690" y="715" rx="22" ry="22" width="270" height="82" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="1010" y="715" rx="22" ry="22" width="230" height="82" fill="#FFFFFF" stroke="#C8DCF7" stroke-width="2"/>
    <rect x="1290" y="715" rx="22" ry="22" width="170" height="82" fill="#EEF5FF" stroke="#C8DCF7" stroke-width="2"/>
  </g>

  <text x="180" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Users</text>
  <text x="450" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Azure Front Door Premium</text>
  <text x="478" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#CFE3FF">WAF, TLS, routing, custom domain</text>
  <text x="932" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A2A6D">Private Link</text>
  <text x="1228" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">WAF Policy</text>
  <text x="1222" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#D4E5FF">Managed rules and rate limits</text>

  <text x="240" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A2A6D">Azure App Service</text>
  <text x="238" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A6E94">System-assigned identity</text>
  <text x="674" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#08345E">Private Endpoint</text>
  <text x="662" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#08345E">Inbound path to origin</text>
  <text x="968" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A2A6D">VNet Integration</text>
  <text x="968" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A6E94">Outbound path to private services</text>

  <text x="175" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private DNS</text>
  <text x="444" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#106B42">Key Vault</text>
  <text x="744" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private Endpoints</text>
  <text x="1052" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">App Insights</text>
  <text x="1342" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Alerts</text>

  <path d="M310 269 H382" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M790 269 H882" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1130 269 H1154" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M730 316 V420 H730 V447" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M370 554 V690 H520 V707" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M1100 554 V690 H520 V707" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M1100 554 V690 H825 V707" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M1100 554 V690 H1125 V707" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M1100 554 V690 H1375 V707" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
</svg>
