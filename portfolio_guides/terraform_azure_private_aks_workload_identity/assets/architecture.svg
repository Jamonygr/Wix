  <path d="M675 322 V430 H700 V442" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M675 322 V430 H1030 V442" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1330 322 V442" stroke="#2C77DA" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 574 V690 H255 V734" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M1030 574 V690 H540 V734" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M700 574 V690 H830 V734" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M675 574 V690 H1125 V734" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <path d="M675 574 V690 H1385 V734" stroke="#476997" stroke-width="5" fill="none" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
</svg>
