<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Terraform private AKS workload identity architecture</title>
  <desc id="desc">Diagram showing a private AKS cluster with OIDC issuer, workload identity, ACR, Key Vault CSI integration, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FBFF"/>
      <stop offset="100%" stop-color="#E8F3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A4678" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2C77DA"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0A2A6D">Terraform Private AKS Platform</text>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#4D6F96">Private control plane, federated workload trust, image supply, and secret retrieval.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" rx="28" ry="28" width="1460" height="170" fill="#EAF4FF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="70" y="370" rx="28" ry="28" width="1460" height="260" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="70" y="660" rx="28" ry="28" width="1460" height="210" fill="#F4FAFF" stroke="#C7DCF7" stroke-width="2"/>
  </g>

  <text x="102" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Control Plane And Trust</text>
  <text x="102" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Cluster Runtime</text>
  <text x="102" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Platform Services</text>

  <g filter="url(#shadow)">
    <rect x="120" y="230" rx="22" ry="22" width="280" height="78" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="460" y="214" rx="24" ry="24" width="430" height="108" fill="#0D3C9A"/>
    <rect x="950" y="230" rx="22" ry="22" width="220" height="78" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="1210" y="214" rx="24" ry="24" width="240" height="108" fill="#173360"/>

    <rect x="160" y="450" rx="24" ry="24" width="360" height="124" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="585" y="450" rx="24" ry="24" width="230" height="124" fill="#3AB7FF"/>
    <rect x="880" y="450" rx="24" ry="24" width="300" height="124" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="1220" y="450" rx="24" ry="24" width="230" height="124" fill="#EAF8EE" stroke="#B9E1C6" stroke-width="2"/>

    <rect x="140" y="742" rx="22" ry="22" width="230" height="76" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="420" y="742" rx="22" ry="22" width="240" height="76" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="710" y="742" rx="22" ry="22" width="240" height="76" fill="#EAF8EE" stroke="#B9E1C6" stroke-width="2"/>
    <rect x="1000" y="742" rx="22" ry="22" width="250" height="76" fill="#FFFFFF" stroke="#C7DCF7" stroke-width="2"/>
    <rect x="1300" y="742" rx="22" ry="22" width="170" height="76" fill="#EEF5FF" stroke="#C7DCF7" stroke-width="2"/>
  </g>

  <text x="176" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Terraform</text>
  <text x="534" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Private AKS Cluster</text>
  <text x="518" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#CFE3FF">OIDC issuer, workload identity, private API</text>
  <text x="988" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">OIDC Issuer</text>
  <text x="1250" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Entra Workload ID</text>
  <text x="1246" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#D4E5FF">Federated trust for service accounts</text>

  <text x="212" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Namespaces And Pods</text>
  <text x="214" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A6E94">Service account annotations drive identity</text>
  <text x="645" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#08345E">CSI Driver</text>
  <text x="616" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#08345E">Secrets Store provider for Azure</text>
  <text x="950" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A2A6D">Kubelet Identity</text>
  <text x="946" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A6E94">Pulls images from Azure Container Registry</text>
  <text x="1280" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#106B42">Key Vault</text>
  <text x="1254" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F6D4B">Secrets mounted into workloads</text>

  <text x="188" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Node Pools</text>
  <text x="468" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">ACR</text>
  <text x="764" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#106B42">Managed Identities</text>
  <text x="1048" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Private DNS</text>
  <text x="1354" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A2A6D">Logs</text>

