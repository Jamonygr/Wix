  <path d="M890 269 H942" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1170 269 H1202" stroke="#2C77DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
