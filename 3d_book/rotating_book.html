<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Book</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: 'Arial', sans-serif;
        }

        .book-container {
            perspective: 1500px;
            width: 300px;
            height: 450px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateBook 8s ease-in-out infinite;
            cursor: pointer;
        }

        .book:hover {
            animation-play-state: paused;
        }

        .book-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 5px;
            box-shadow: 
                0 0 30px rgba(255, 0, 255, 0.3),
                0 0 60px rgba(0, 255, 255, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .book-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .front {
            transform: rotateY(0deg);
        }

        .back {
            transform: rotateY(180deg);
        }

        /* Book spine effect */
        .spine {
            position: absolute;
            width: 40px;
            height: 100%;
            left: -20px;
            transform: rotateY(-90deg) translateZ(0px);
            background: linear-gradient(180deg, 
                #1a1a2e 0%, 
                #16213e 50%, 
                #1a1a2e 100%);
            box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.3);
        }

        /* Neon glow effect */
        .book::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            left: -10%;
            top: -10%;
            background: radial-gradient(ellipse at center, 
                rgba(255, 0, 255, 0.1) 0%, 
                rgba(0, 255, 255, 0.05) 50%, 
                transparent 70%);
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes rotateBook {
            0%, 10% {
                transform: rotateY(0deg) rotateX(5deg);
            }
            40%, 60% {
                transform: rotateY(180deg) rotateX(5deg);
            }
            90%, 100% {
                transform: rotateY(360deg) rotateX(5deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* Click link wrapper */
        .book-link {
            display: block;
            text-decoration: none;
        }

        /* 80s Neon Title (optional) */
        .book-title {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff00ff;
            text-shadow: 
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 30px #ff00ff;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            95% { opacity: 0.9; }
            96% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="book-container">
        <a href="https://www.amazon.com/dp/B0FNWHP15X" target="_blank" class="book-link">
            <div class="book">
                <!-- FRONT COVER -->
                <div class="book-face front">
                    <img src="front-cover.png" alt="Book Front Cover" id="frontCover">
                </div>
                
                <!-- BACK COVER -->
                <div class="book-face back">
                    <img src="back-cover.png" alt="Book Back Cover" id="backCover">
                </div>
                
                <!-- SPINE -->
                <div class="spine"></div>
            </div>
        </a>
    </div>

    <script>
        // Configuration - Replace these with your actual image URLs
        const CONFIG = {
            // Front cover image URL (your current book cover)
            frontCover: 'https://static.wixstatic.com/media/32fce1_YOUR_FRONT_COVER_ID~mv2.png',
            
            // Back cover image URL (upload to Wix Media and get the URL)
            backCover: 'https://static.wixstatic.com/media/32fce1_YOUR_BACK_COVER_ID~mv2.png',
            
            // Amazon link
            amazonLink: 'https://www.amazon.com/dp/B0FNWHP15X'
        };

        // Apply configuration
        document.getElementById('frontCover').src = CONFIG.frontCover;
        document.getElementById('backCover').src = CONFIG.backCover;
        document.querySelector('.book-link').href = CONFIG.amazonLink;
    </script>
</body>
</html>
