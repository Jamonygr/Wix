<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Book - BeyondCloudWithChriz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            overflow: hidden;
        }

        .scene {
            perspective: 1200px;
            width: 280px;
            height: 400px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .cover {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px 4px 4px 8px;
            overflow: hidden;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .front {
            transform: translateZ(15px);
            box-shadow: 
                -5px 5px 30px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(255, 0, 255, 0.3),
                0 0 30px rgba(0, 255, 255, 0.2);
        }

        .back {
            transform: rotateY(180deg) translateZ(15px);
            box-shadow: 
                5px 5px 30px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(255, 0, 255, 0.3),
                0 0 30px rgba(0, 255, 255, 0.2);
        }

        /* Book spine with 80s gradient */
        .spine-left {
            position: absolute;
            width: 30px;
            height: 100%;
            left: 0;
            transform: rotateY(-90deg) translateZ(0px) translateX(-15px);
            background: linear-gradient(to bottom, 
                #2d1b4e 0%, 
                #1a0a30 20%,
                #0d0620 50%,
                #1a0a30 80%,
                #2d1b4e 100%);
            border-top: 2px solid rgba(255, 0, 255, 0.3);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
        }

        /* Top and bottom edges */
        .edge-top {
            position: absolute;
            width: 100%;
            height: 30px;
            top: 0;
            transform: rotateX(90deg) translateZ(0px) translateY(-15px);
            background: linear-gradient(to right, #f5f5dc, #e8e8d0);
        }

        .edge-bottom {
            position: absolute;
            width: 100%;
            height: 30px;
            bottom: 0;
            transform: rotateX(-90deg) translateZ(0px) translateY(15px);
            background: linear-gradient(to right, #f5f5dc, #e8e8d0);
        }

        /* Right edge (pages) */
        .pages {
            position: absolute;
            width: 30px;
            height: 100%;
            right: 0;
            transform: rotateY(90deg) translateZ(calc(100% - 15px)) translateX(15px);
            background: repeating-linear-gradient(
                to bottom,
                #fafaf5 0px,
                #fafaf5 2px,
                #e8e8e0 2px,
                #e8e8e0 3px
            );
        }

        @keyframes spin {
            0% {
                transform: rotateY(-20deg) rotateX(5deg);
            }
            25% {
                transform: rotateY(70deg) rotateX(3deg);
            }
            50% {
                transform: rotateY(160deg) rotateX(5deg);
            }
            75% {
                transform: rotateY(250deg) rotateX(3deg);
            }
            100% {
                transform: rotateY(340deg) rotateX(5deg);
            }
        }

        /* Hover pause */
        .book:hover {
            animation-play-state: paused;
        }

        /* Neon glow underneath */
        .glow {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: radial-gradient(ellipse, 
                rgba(255, 0, 255, 0.4) 0%, 
                rgba(0, 255, 255, 0.2) 40%, 
                transparent 70%);
            filter: blur(10px);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        a {
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.com/dp/B0FNWHP15X" target="_blank" id="bookLink">
        <div class="scene">
            <div class="book">
                <!-- Front Cover -->
                <div class="cover front">
                    <img id="imgFront" src="" alt="Front Cover">
                </div>
                
                <!-- Back Cover -->
                <div class="cover back">
                    <img id="imgBack" src="" alt="Back Cover">
                </div>
                
                <!-- Spine -->
                <div class="spine-left"></div>
                
                <!-- Pages edge -->
                <div class="pages"></div>
                
                <!-- Top/Bottom edges -->
                <div class="edge-top"></div>
                <div class="edge-bottom"></div>
            </div>
            <div class="glow"></div>
        </div>
    </a>

    <script>
        /*******************************************************
         * CONFIGURATION - UPDATE THESE VALUES
         *******************************************************/
        
        // Your front cover image (currently on your site)
        // Upload your images to Wix Media Manager and copy the URL
        const FRONT_COVER = 'YOUR_FRONT_COVER_URL_HERE';
        
        // Your back cover image (upload to Wix)
        const BACK_COVER = 'YOUR_BACK_COVER_URL_HERE';
        
        // Amazon book link
        const AMAZON_LINK = 'https://www.amazon.com/dp/B0FNWHP15X';
        
        /*******************************************************
         * Apply Configuration
         *******************************************************/
        document.getElementById('imgFront').src = FRONT_COVER;
        document.getElementById('imgBack').src = BACK_COVER;
        document.getElementById('bookLink').href = AMAZON_LINK;
    </script>
</body>
</html>
