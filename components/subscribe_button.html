<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - BeyondCloudWithChriz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: 'Arial', sans-serif;
        }
        .subscribe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
        }
        .subscribe-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
            animation: flicker 3s infinite;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .email-input {
            padding: 15px 25px;
            font-size: 16px;
            border: 2px solid #ff00ff;
            border-radius: 5px;
            background: rgba(13, 6, 32, 0.8);
            color: #ffffff;
            outline: none;
            min-width: 280px;
            transition: all 0.3s ease;
        }
        .email-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .email-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.1);
        }
        .subscribe-btn {
            position: relative;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff00ff 0%, #8b00ff 50%, #00ffff 100%);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.3);
        }
        .subscribe-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .subscribe-btn:hover::before { left: 100%; }
        .subscribe-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), 0 0 60px rgba(0, 255, 255, 0.5), 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .subscribe-btn:active { transform: translateY(0); }
        .subscribe-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .message {
            display: none;
            font-size: 14px;
            animation: fadeIn 0.5s ease;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .message.success {
            display: block;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .message.error {
            display: block;
            color: #ff4444;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
        .message.hidden { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            97% { opacity: 1; }
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 500px) {
            .email-input { min-width: 100%; }
            .subscribe-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="subscribe-container">
        <h3 class="subscribe-title">🎮 Join the Grid</h3>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 10px;">Get Azure updates & synthwave vibes in your inbox</p>
        <div class="input-group">
            <input type="email" class="email-input" id="emailInput" placeholder="Enter your email address" required>
            <button class="subscribe-btn" id="subscribeBtn">Subscribe</button>
        </div>
        <p class="message hidden" id="messageBox"></p>
    </div>

    <script>
        const btn = document.getElementById('subscribeBtn');
        const emailInput = document.getElementById('emailInput');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isSuccess) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + (isSuccess ? 'success' : 'error');
            setTimeout(() => { messageBox.className = 'message hidden'; }, 5000);
        }

        btn.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            
            if (!email || !email.includes('@') || !email.includes('.')) {
                showMessage('⚠️ Please enter a valid email address', false);
                return;
            }

            // Disable button and show loading
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = 'Subscribing';

            try {
                // Send to parent window (Wix) if embedded
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'SUBSCRIBE', email: email }, '*');
                }

                // Store locally as backup
                const subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
                if (!subscribers.includes(email)) {
                    subscribers.push(email);
                    localStorage.setItem('subscribers', JSON.stringify(subscribers));
                }

                // Show success
                emailInput.value = '';
                showMessage('✨ Welcome to the Grid! You\'re now subscribed.', true);

            } catch (error) {
                showMessage('❌ Something went wrong. Please try again.', false);
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = 'Subscribe';
            }
        });

        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
