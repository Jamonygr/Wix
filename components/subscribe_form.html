<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - BeyondCloudWithChriz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .subscribe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .subscribe-title {
            color: #00ffff;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.8), 
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 30px rgba(0, 255, 255, 0.3);
            margin-bottom: 5px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.5); }
            to { text-shadow: 0 0 15px rgba(0, 255, 255, 1), 0 0 30px rgba(0, 255, 255, 0.7), 0 0 40px rgba(255, 0, 255, 0.5); }
        }

        .subscribe-subtitle {
            color: #aaaaaa;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .email-input {
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #ff00ff;
            border-radius: 8px;
            background: rgba(13, 6, 32, 0.9);
            color: #ffffff;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .email-input:focus {
            border-color: #00ffff;
            box-shadow: 
                0 0 15px rgba(0, 255, 255, 0.5), 
                0 0 30px rgba(0, 255, 255, 0.2),
                inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .subscribe-btn {
            position: relative;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff00ff 0%, #8b00ff 50%, #00ffff 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.5), 
                0 0 40px rgba(0, 255, 255, 0.3);
            width: 100%;
        }

        .subscribe-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .subscribe-btn:hover::before {
            left: 100%;
        }

        .subscribe-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(255, 0, 255, 0.7), 
                0 0 60px rgba(0, 255, 255, 0.5), 
                0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .subscribe-btn:active {
            transform: translateY(0);
        }

        .subscribe-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .subscribe-btn.loading {
            pointer-events: none;
        }

        .subscribe-btn.loading::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            display: none;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(-15px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .message.success {
            display: block;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.4);
        }

        .message.error {
            display: block;
            color: #ff4466;
            text-shadow: 0 0 10px rgba(255, 68, 102, 0.8);
            background: rgba(255, 68, 102, 0.1);
            border: 1px solid rgba(255, 68, 102, 0.4);
        }

        .message.hidden {
            display: none;
        }

        /* Confetti animation for success */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            opacity: 0;
        }

        @media (max-width: 480px) {
            .subscribe-container {
                padding: 20px 15px;
            }
            .subscribe-title {
                font-size: 18px;
                letter-spacing: 2px;
            }
            .email-input, .subscribe-btn {
                padding: 14px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="subscribe-container">
        <h3 class="subscribe-title">🎮 Join the Grid</h3>
        <p class="subscribe-subtitle">Get Azure updates & synthwave vibes delivered to your inbox</p>
        
        <div class="form-group">
            <input 
                type="email" 
                class="email-input" 
                id="emailInput" 
                placeholder="Enter your email address" 
                required
                autocomplete="email"
            >
            <button class="subscribe-btn" id="subscribeBtn">
                <span id="btnText">Subscribe</span>
            </button>
        </div>
        
        <p class="message hidden" id="messageBox"></p>
    </div>

    <script>
        const btn = document.getElementById('subscribeBtn');
        const btnText = document.getElementById('btnText');
        const emailInput = document.getElementById('emailInput');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isSuccess) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + (isSuccess ? 'success' : 'error');
            
            if (isSuccess) {
                createConfetti();
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageBox.className = 'message hidden';
            }, 5000);
        }

        function createConfetti() {
            const colors = ['#ff00ff', '#00ffff', '#ff00aa', '#00ff88', '#ffff00'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.opacity = '1';
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(confetti);
                    
                    // Animate falling
                    const animation = confetti.animate([
                        { top: '-10px', opacity: 1 },
                        { top: '100vh', opacity: 0 }
                    ], {
                        duration: 2000 + Math.random() * 1000,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });
                    
                    animation.onfinish = () => confetti.remove();
                }, i * 50);
            }
        }

        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        btn.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            
            // Validate email
            if (!email) {
                showMessage('⚠️ Please enter your email address', false);
                emailInput.focus();
                return;
            }
            
            if (!validateEmail(email)) {
                showMessage('⚠️ Please enter a valid email address', false);
                emailInput.focus();
                return;
            }

            // Disable button and show loading state
            btn.disabled = true;
            btn.classList.add('loading');
            btnText.textContent = 'Subscribing';

            try {
                // Send message to parent window (Wix) if embedded in iframe
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'NEWSLETTER_SUBSCRIBE',
                        email: email,
                        timestamp: new Date().toISOString()
                    }, '*');
                }

                // Simulate API call delay (remove this in production if using real API)
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Store subscriber locally as backup
                const subscribers = JSON.parse(localStorage.getItem('gridSubscribers') || '[]');
                if (!subscribers.find(s => s.email === email)) {
                    subscribers.push({
                        email: email,
                        subscribedAt: new Date().toISOString()
                    });
                    localStorage.setItem('gridSubscribers', JSON.stringify(subscribers));
                }

                // Clear input and show success
                emailInput.value = '';
                showMessage('✨ Welcome to the Grid! You\'re now subscribed.', true);

            } catch (error) {
                console.error('Subscription error:', error);
                showMessage('❌ Something went wrong. Please try again.', false);
            } finally {
                // Reset button state
                btn.disabled = false;
                btn.classList.remove('loading');
                btnText.textContent = 'Subscribe';
            }
        });

        // Allow Enter key to submit
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                btn.click();
            }
        });

        // Clear error message when user starts typing
        emailInput.addEventListener('input', function() {
            if (messageBox.classList.contains('error')) {
                messageBox.className = 'message hidden';
            }
        });
    </script>
</body>
</html>
