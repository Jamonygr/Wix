<!-- 
  NEON BLOG EFFECTS - BeyondCloudWithChriz
  
  HOW TO ADD TO WIX:
  1. Go to your Wix Editor
  2. Go to your Blog page
  3. Click "+" (Add Elements) → Embed → HTML embed
  4. Paste this entire code
  5. Position it anywhere on the page (it's invisible but applies styles)
-->

<style>
/* ========================================
   NEON GLOW EFFECTS FOR BLOG
   Synthwave/Retrowave Theme
   ======================================== */

/* ===== NEON BLOG TITLES ===== */
/* Main blog post titles - Cyan neon glow */
[data-hook="blog-post-title"],
.blog-post-title,
h1.post-title,
.post-header h1 {
  color: #00f5ff !important;
  text-shadow: 
    0 0 5px #00f5ff,
    0 0 10px #00f5ff,
    0 0 20px #00f5ff,
    0 0 40px #00a8cc,
    0 0 80px #00a8cc !important;
  font-family: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif !important;
  letter-spacing: 2px !important;
  animation: neonPulse 2s ease-in-out infinite alternate;
}

/* Blog card titles - Magenta/Pink neon */
[data-hook="post-title"],
.post-title,
.blog-card-title {
  color: #ff00ff !important;
  text-shadow: 
    0 0 5px #ff00ff,
    0 0 10px #ff00ff,
    0 0 20px #ff00ff,
    0 0 40px #cc00cc !important;
  transition: all 0.3s ease !important;
}

[data-hook="post-title"]:hover,
.post-title:hover,
.blog-card-title:hover {
  color: #00f5ff !important;
  text-shadow: 
    0 0 5px #00f5ff,
    0 0 10px #00f5ff,
    0 0 30px #00f5ff,
    0 0 60px #00a8cc !important;
  transform: scale(1.02);
}

/* ===== NEON BLOG CARDS ===== */
/* Card containers with neon border */
[data-hook="post-list-item"],
.blog-card,
.post-list-item,
article[data-hook] {
  background: linear-gradient(135deg, rgba(10, 10, 30, 0.9), rgba(20, 5, 40, 0.9)) !important;
  border: 2px solid transparent !important;
  border-image: linear-gradient(135deg, #ff00ff, #00f5ff, #ff00ff) 1 !important;
  box-shadow: 
    0 0 10px rgba(255, 0, 255, 0.3),
    0 0 20px rgba(0, 245, 255, 0.2),
    inset 0 0 30px rgba(255, 0, 255, 0.05) !important;
  border-radius: 8px !important;
  transition: all 0.4s ease !important;
  position: relative;
  overflow: hidden;
}

[data-hook="post-list-item"]:hover,
.blog-card:hover,
.post-list-item:hover {
  box-shadow: 
    0 0 20px rgba(255, 0, 255, 0.5),
    0 0 40px rgba(0, 245, 255, 0.4),
    0 0 60px rgba(255, 0, 255, 0.3),
    inset 0 0 50px rgba(0, 245, 255, 0.1) !important;
  transform: translateY(-5px) scale(1.01);
  border-image: linear-gradient(135deg, #00f5ff, #ff00ff, #00f5ff) 1 !important;
}

/* Neon corner accents */
[data-hook="post-list-item"]::before,
.blog-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  border-top: 3px solid #00f5ff;
  border-left: 3px solid #00f5ff;
  box-shadow: 
    -5px -5px 10px rgba(0, 245, 255, 0.5),
    inset 5px 5px 10px rgba(0, 245, 255, 0.3);
}

[data-hook="post-list-item"]::after,
.blog-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 0;
  width: 30px;
  height: 30px;
  border-bottom: 3px solid #ff00ff;
  border-right: 3px solid #ff00ff;
  box-shadow: 
    5px 5px 10px rgba(255, 0, 255, 0.5),
    inset -5px -5px 10px rgba(255, 0, 255, 0.3);
}

/* ===== ANIMATIONS ===== */
@keyframes neonPulse {
  from {
    text-shadow: 
      0 0 5px #00f5ff,
      0 0 10px #00f5ff,
      0 0 20px #00f5ff,
      0 0 40px #00a8cc;
  }
  to {
    text-shadow: 
      0 0 10px #00f5ff,
      0 0 20px #00f5ff,
      0 0 40px #00f5ff,
      0 0 80px #00a8cc,
      0 0 120px #00a8cc;
  }
}

@keyframes borderGlow {
  0%, 100% {
    border-image: linear-gradient(135deg, #ff00ff, #00f5ff, #ff00ff) 1;
  }
  50% {
    border-image: linear-gradient(135deg, #00f5ff, #ff00ff, #00f5ff) 1;
  }
}

/* ===== BLOG EXCERPT TEXT ===== */
[data-hook="post-description"],
.post-excerpt,
.blog-post-excerpt {
  color: #b0b0b0 !important;
  text-shadow: 0 0 5px rgba(176, 176, 176, 0.3) !important;
}

/* ===== READ MORE BUTTON ===== */
[data-hook="read-more-link"],
.read-more-link,
.blog-read-more {
  color: #00f5ff !important;
  text-shadow: 0 0 10px #00f5ff !important;
  border: 1px solid #00f5ff !important;
  padding: 8px 20px !important;
  transition: all 0.3s ease !important;
  text-transform: uppercase;
  letter-spacing: 2px;
}

[data-hook="read-more-link"]:hover,
.read-more-link:hover {
  background: #00f5ff !important;
  color: #0a0a1e !important;
  box-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff !important;
}

/* ===== NEON BACKGROUND - BLACK WITH SYNTHWAVE EFFECTS ===== */
.blog-page-container,
[data-hook="blog-post-page"],
[data-hook="blog-feed-page"],
main,
body {
  background: 
    /* Neon glow spots */
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255, 0, 255, 0.15), transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 30%, rgba(0, 245, 255, 0.12), transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 80%, rgba(255, 0, 255, 0.1), transparent 50%),
    radial-gradient(ellipse 50% 30% at 10% 70%, rgba(0, 245, 255, 0.08), transparent 50%),
    /* Synthwave grid effect */
    linear-gradient(rgba(255, 0, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 0, 255, 0.03) 1px, transparent 1px),
    /* Base dark gradient */
    linear-gradient(180deg, #0a0a1a 0%, #0d0015 50%, #050510 100%) !important;
  background-size: 
    100% 100%,
    100% 100%,
    100% 100%,
    100% 100%,
    50px 50px,
    50px 50px,
    100% 100% !important;
  background-attachment: fixed !important;
  min-height: 100vh;
}

/* Animated neon line at top */
.blog-page-container::before,
[data-hook="blog-feed-page"]::before,
main::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, 
    transparent, 
    #ff00ff, 
    #00f5ff, 
    #ff00ff, 
    transparent);
  box-shadow: 
    0 0 10px #ff00ff,
    0 0 20px #ff00ff,
    0 0 40px #00f5ff;
  animation: neonLineMove 3s ease-in-out infinite;
  z-index: 1000;
}

@keyframes neonLineMove {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* Scanline effect overlay */
.blog-page-container::after,
[data-hook="blog-feed-page"]::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.1) 2px,
    rgba(0, 0, 0, 0.1) 4px
  );
  pointer-events: none;
  z-index: 999;
}

/* ===== DATE/META INFO ===== */
[data-hook="post-date"],
.post-date,
.post-meta {
  color: #ff00ff !important;
  text-shadow: 0 0 5px rgba(255, 0, 255, 0.5) !important;
  font-size: 0.85em;
  letter-spacing: 1px;
}

/* ===== TAGS ===== */
[data-hook="post-tags"] a,
.post-tag,
.blog-tag {
  background: transparent !important;
  border: 1px solid #ff00ff !important;
  color: #ff00ff !important;
  padding: 4px 12px !important;
  border-radius: 20px !important;
  text-shadow: 0 0 5px rgba(255, 0, 255, 0.5) !important;
  transition: all 0.3s ease !important;
}

[data-hook="post-tags"] a:hover,
.post-tag:hover {
  background: #ff00ff !important;
  color: #0a0a1e !important;
  box-shadow: 0 0 15px #ff00ff !important;
}

</style>

<script>
// Add Google Font for futuristic look
const link = document.createElement('link');
link.href = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap';
link.rel = 'stylesheet';
document.head.appendChild(link);

console.log('🌟 Neon effects loaded - BeyondCloudWithChriz');
</script>
